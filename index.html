<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>学習サポート掲示板</title>
  
  <!-- Google Fonts: Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f2ebd9;       /* ナチュラルベージュ背景 */
      --card-bg: #fffdf7;        /* カードアイボリー */
      --text-main: #332f2b;      /* 濃いブラウン */
      --text-sub: #7a7369;       /* アースグレー */
      --primary: #2e7d32;        /* ナチュラルグリーン */
      --primary-light: #e8f5e9;
      --success: #4caf50;        /* ライトグリーン */
      --danger: #d32f2f;         /* アースレッド */
      --border: #dcd4c3;         /* 境界線 */
      --my-msg-bg: #81c784;      /* 自分の吹き出し */
      --chat-bg: #e2d9c4;        /* トーク画面背景 */
    }

    body {
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      font-weight: 700;
      background-color: var(--bg-color);
      color: var(--text-main);
      max-width: 768px;
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 900;
      margin: 0;
      color: #1b5e20;
      letter-spacing: 0.05em;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #e8e0ce;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .badge-avatar-img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    .solve-count-tag {
      background: #2e7d32;
      color: white;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(60, 50, 30, 0.06);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    /* フォーム要素 */
    input, textarea, select {
      font-family: inherit;
      font-weight: 700;
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
      background-color: #e8e0ce;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text-main);
      outline: none;
    }

    button {
      font-family: inherit;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background-color: var(--primary);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active { 
      opacity: 0.8; 
      transform: scale(0.98);
    }

    /* 画像アイコン選択エリア */
    .icon-selector-label {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: block;
    }

    .icon-selector {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .icon-wrapper {
      position: relative;
      display: inline-block;
    }

    .icon-option {
      width: 60px;
      height: 60px;
      padding: 4px;
      background: #e8e0ce;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s;
      object-fit: cover;
    }

    .icon-option.selected {
      border-color: var(--primary);
      background: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .icon-option.locked {
      filter: grayscale(100%) opacity(0.5);
      cursor: not-allowed;
    }

    .lock-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #333;
      color: #fff;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 8px;
    }

    /* 募集一覧アイテム */
    .request-item {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    
    .request-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .request-info { 
      flex-grow: 1; 
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .request-avatar-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .request-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
    .request-meta { font-size: 0.75rem; color: var(--text-sub); display: flex; gap: 8px; align-items: center; }

    .btn-chat {
      background-color: var(--success);
      width: auto;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    /* チャット画面 */
    #chat-section, #login-section, #matching-section { display: none; }
    
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-back {
      background-color: var(--text-sub);
      width: auto;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .btn-resolve {
      background-color: var(--danger);
      width: auto;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: none;
    }

    #chat-title {
      font-size: 1.15rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    /* トーク画面 */
    #chat-box {
      border: 1px solid var(--border);
      height: 440px;
      overflow-y: auto;
      padding: 16px;
      margin-bottom: 12px;
      background: var(--chat-bg);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* メッセージ行 */
    .msg-row {
      display: flex;
      width: 100%;
      align-items: flex-end;
      gap: 8px;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.my-msg { flex-direction: row-reverse; }
    .msg-row.other-msg { flex-direction: row; }

    .msg-avatar-img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 2px;
      border: 1px solid var(--border);
    }

    .msg-content-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 70%;
    }

    .msg-sender-name {
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-bottom: 2px;
      padding: 0 4px;
    }

    .my-msg .msg-sender-name { text-align: right; }

    /* フキダシ */
    .msg-bubble {
      padding: 10px 16px;
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      font-weight: 500;
    }

    .my-msg .msg-bubble {
      background: var(--my-msg-bg);
      color: #113013;
      border-bottom-right-radius: 4px;
    }

    .other-msg .msg-bubble {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-meta {
      display: flex;
      flex-direction: column;
      font-size: 0.7rem;
      color: #666055;
      line-height: 1.2;
      margin-bottom: 2px;
      font-weight: 700;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input { margin-bottom: 0; }
    .input-group button { width: auto; white-space: nowrap; padding: 0 20px; }
  </style>
</head>
<body>

  <header id="main-header">
    <h1>学習サポート掲示板</h1>
    <div id="user-badge" class="user-profile-badge" style="display:none;" onclick="showLoginScreen()">
      <img id="badge-icon" class="badge-avatar-img" src="icon1.png" alt="icon">
      <span id="badge-name">ゲスト</span>
      <span id="badge-solve-count" class="solve-count-tag">解決: 0</span>
      <span style="font-size:0.7rem; color:var(--text-sub);">⚙️</span>
    </div>
  </header>

  <!-- ==================== 0. ログイン / プロフィール設定画面 ==================== -->
  <div id="login-section">
    <div class="card" style="text-align: center; max-width: 400px; margin: 40px auto;">
      <h2>アイコンと名前を選ぼう</h2>
      <p style="font-size:0.85rem; color:var(--text-sub); margin-bottom: 12px;">教えて解決数が増えると使えるアイコンが増えます！</p>
      
      <p style="font-weight:bold; color:var(--primary); margin-bottom:16px;">現在の解決ポイント: <span id="user-solve-display">0</span> 回</p>

      <span class="icon-selector-label">アイコンを選択：</span>
      <div class="icon-selector" id="login-icon-selector">
        <div class="icon-wrapper">
          <img class="icon-option selected" src="icon1.png" data-min="0" onclick="selectLoginIcon('icon1.png', this)" alt="アイコン1">
        </div>
        <div class="icon-wrapper">
          <img class="icon-option" src="icon2.png" data-min="0" onclick="selectLoginIcon('icon2.png', this)" alt="アイコン2">
        </div>
        <div class="icon-wrapper">
          <img class="icon-option locked" src="icon3.png" data-min="1" onclick="selectLoginIcon('icon3.png', this)" alt="アイコン3">
          <span class="lock-badge" id="lock-icon3">1回〜</span>
        </div>
        <div class="icon-wrapper">
          <img class="icon-option locked" src="icon4.png" data-min="3" onclick="selectLoginIcon('icon4.png', this)" alt="アイコン4">
          <span class="lock-badge" id="lock-icon4">3回〜</span>
        </div>
      </div>

      <input type="text" id="userNameInput" placeholder="名前または出席番号（例：12番 たろう）">
      <button id="btn-login-submit">掲示板にはいる</button>
    </div>
  </div>


  <!-- ==================== 1. 一覧画面 ==================== -->
  <div id="matching-section">
    <div class="card">
      <h2>質問・相談を投稿する</h2>
      <input type="text" id="reqSubject" placeholder="質問内容（例：数学P24の問3、英語の文法）">
      <button id="btn-create-request">投稿して質問する</button>
    </div>

    <div class="card">
      <h2>質問一覧</h2>
      <div id="request-list">読み込み中...</div>
    </div>
  </div>


  <!-- ==================== 2. チャット画面 ==================== -->
  <div id="chat-section">
    <div class="chat-header">
      <button id="btn-back-to-list" class="btn-back">← 一覧に戻る</button>
      <button id="btn-resolve" class="btn-resolve">解決済みにする</button>
    </div>

    <div class="card">
      <div style="text-align: center;">
        <h2 id="chat-title">質問</h2>
      </div>

      <div id="chat-box"></div>

      <div class="input-group">
        <input type="text" id="messageText" placeholder="メッセージを入力...">
        <button id="btn-send">送信</button>
      </div>
    </div>
  </div>


  <!-- Firebase (v10) SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp, getDocs, setDoc, getDoc, updateDoc, increment } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAkGHvYqrhlu3bF_P6LIXk0YjmSAfyFj08",
      authDomain: "study-matching-test.firebaseapp.com",
      projectId: "study-matching-test",
      storageBucket: "study-matching-test.firebasestorage.app",
      messagingSenderId: "720859286999",
      appId: "1:720859286999:web:9f61a8a71989db79d94f92",
      measurementId: "G-62FYMVGYFY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ユーザー識別用ID
    let senderId = localStorage.getItem("senderId");
    if (!senderId) {
      senderId = "user_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("senderId", senderId);
    }

    let myIcon = localStorage.getItem("myIcon") || "icon1.png";
    let myName = localStorage.getItem("myName") || "";
    let mySolveCount = 0;

    let currentRoomId = null;
    let currentDocId = null;
    let currentOwnerId = null;
    let unsubscribeChat = null;

    // ユーザーデータ（解決数）取得
    async function loadUserData() {
      const userRef = doc(db, "users", senderId);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {
        mySolveCount = userSnap.data().solveCount || 0;
      } else {
        await setDoc(userRef, { solveCount: 0, createdAt: serverTimestamp() });
        mySolveCount = 0;
      }
      updateUIWithUserData();
    }

    function updateUIWithUserData() {
      document.getElementById("user-solve-display").innerText = mySolveCount;
      document.getElementById("badge-solve-count").innerText = `解決: ${mySolveCount}`;

      document.querySelectorAll('#login-icon-selector .icon-option').forEach(opt => {
        const minReq = parseInt(opt.getAttribute("data-min") || "0", 10);
        if (mySolveCount >= minReq) {
          opt.classList.remove('locked');
          const badge = opt.parentElement.querySelector('.lock-badge');
          if (badge) badge.style.display = 'none';
        } else {
          opt.classList.add('locked');
        }
      });
    }

    // ログイン・設定画面
    window.selectLoginIcon = function(iconSrc, element) {
      const minReq = parseInt(element.getAttribute("data-min") || "0", 10);
      if (mySolveCount < minReq) {
        alert(`このアイコンを使うには「解決数」が ${minReq} 回以上必要です！（現在の解決数: ${mySolveCount} 回）`);
        return;
      }

      myIcon = iconSrc;
      document.querySelectorAll('#login-icon-selector .icon-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      element.classList.add('selected');
    };

    window.showLoginScreen = function() {
      updateUIWithUserData();
      document.getElementById("login-section").style.display = "block";
      document.getElementById("matching-section").style.display = "none";
      document.getElementById("chat-section").style.display = "none";
      document.getElementById("user-badge").style.display = "none";
      
      document.getElementById("userNameInput").value = myName;
      document.querySelectorAll('#login-icon-selector .icon-option').forEach(opt => {
        if (opt.getAttribute("src") === myIcon) opt.classList.add('selected');
        else opt.classList.remove('selected');
      });
    };

    function saveProfileAndStart() {
      const nameVal = document.getElementById("userNameInput").value.trim();
      if (!nameVal) {
        alert("名前または出席番号を入力してください。");
        return;
      }
      myName = nameVal;
      localStorage.setItem("myIcon", myIcon);
      localStorage.setItem("myName", myName);

      document.getElementById("badge-icon").src = myIcon;
      document.getElementById("badge-name").innerText = myName;
      document.getElementById("user-badge").style.display = "flex";

      document.getElementById("login-section").style.display = "none";
      document.getElementById("matching-section").style.display = "block";
    }

    loadUserData().then(() => {
      if (!myName) {
        showLoginScreen();
      } else {
        document.getElementById("badge-icon").src = myIcon;
        document.getElementById("badge-name").innerText = myName;
        document.getElementById("user-badge").style.display = "flex";
        document.getElementById("matching-section").style.display = "block";
      }
    });

    // --- 1. 質問投稿 ---
    async function createRequest() {
      const subject = document.getElementById("reqSubject").value.trim();
      if (!subject) {
        alert("質問内容を入力してください。");
        return;
      }

      const roomId = "room_" + Date.now();

      try {
        const docRef = await addDoc(collection(db, "requests"), {
          subject: subject,
          roomId: roomId,
          ownerId: senderId,
          authorName: myName,
          icon: myIcon,
          createdAt: serverTimestamp()
        });
        document.getElementById("reqSubject").value = "";
        openChat(roomId, subject, docRef.id, senderId);
      } catch (e) {
        alert("エラーが発生しました: " + e.message);
      }
    }

    // --- 2. 一覧表示 ---
    const qRequests = query(collection(db, "requests"), orderBy("createdAt", "desc"));
    onSnapshot(qRequests, (snapshot) => {
      const listDiv = document.getElementById("request-list");
      listDiv.innerHTML = "";

      if (snapshot.empty) {
        listDiv.innerHTML = "<p style='color: var(--text-sub); text-align: center; margin: 20px 0;'>現在、質問はありません。</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const docId = docSnap.id;
        const icon = data.icon || "icon1.png";
        const author = data.authorName || "ゲスト";

        const item = document.createElement("div");
        item.className = "request-item";

        item.innerHTML = `
          <div class="request-info">
            <img class="request-avatar-img" src="${icon}" alt="icon">
            <div>
              <div class="request-title">${data.subject}</div>
              <div class="request-meta">
                <span>質問者: ${author}</span>
              </div>
            </div>
          </div>
          <button class="btn-chat" onclick="openChat('${data.roomId}', '${data.subject}', '${docId}', '${data.ownerId}')">見にいく</button>
        `;
        listDiv.appendChild(item);
      });
    });

    // --- 3. チャット画面を開く ---
    window.openChat = function(roomId, subject, docId, ownerId) {
      currentRoomId = roomId;
      currentDocId = docId;
      currentOwnerId = ownerId;

      document.getElementById("matching-section").style.display = "none";
      document.getElementById("chat-section").style.display = "block";
      document.getElementById("chat-title").innerText = `「${subject}」`;

      const resolveBtn = document.getElementById("btn-resolve");
      if (senderId === ownerId) {
        resolveBtn.style.display = "block";
      } else {
        resolveBtn.style.display = "none";
      }

      joinChatRoom(roomId);
    };

    document.getElementById("btn-back-to-list").addEventListener("click", () => {
      if (unsubscribeChat) unsubscribeChat();
      document.getElementById("chat-section").style.display = "none";
      document.getElementById("matching-section").style.display = "block";
    });

    // --- 4. 解決済みにする（回答者にポイント付与） ---
    async function resolveRequest() {
      if (senderId !== currentOwnerId) {
        alert("質問を投稿した本人だけが解決済みにできます。");
        return;
      }

      if (!currentDocId || !currentRoomId) {
        document.getElementById("btn-back-to-list").click();
        return;
      }

      const confirmResolve = confirm("この質問を「解決済み」にしますか？\n※教えてくれた回答者に解決ポイントが届きます！");
      if (!confirmResolve) return;

      try {
        const helpers = new Set();

        // 掲示板内で自分以外にメッセージを送った回答者を取得
        const msgSnap = await getDocs(collection(db, "rooms", currentRoomId, "messages"));
        msgSnap.forEach((msgDoc) => {
          const msgData = msgDoc.data();
          if (msgData.senderId && msgData.senderId !== senderId) {
            helpers.add(msgData.senderId);
          }
        });

        // ポイント(+1)を各回答者に加算
        const updatePromises = Array.from(helpers).map(helperId => {
          const helperRef = doc(db, "users", helperId);
          return updateDoc(helperRef, {
            solveCount: increment(1)
          }).catch(async () => {
            await setDoc(helperRef, { solveCount: 1, createdAt: serverTimestamp() }, { merge: true });
          });
        });

        await Promise.all(updatePromises);

        // 投稿を削除
        await deleteDoc(doc(db, "requests", currentDocId));

        if (helpers.size > 0) {
          alert(`解決済みにしました！🎉\n教えてくれた ${helpers.size} 名の回答者にポイントが届きました！`);
        } else {
          alert("解決済みにしました！");
        }

        document.getElementById("btn-back-to-list").click();
      } catch (e) {
        alert("エラーが発生しました: " + e.message);
      }
    }

    // 時刻フォーマット (HH:MM)
    function formatTime(timestamp) {
      if (!timestamp) return "";
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    // --- 5. リアルタイム・チャット受信 ---
    function joinChatRoom(roomId) {
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = "<p style='color: var(--text-sub); text-align: center;'>チャットに接続中...</p>";

      if (unsubscribeChat) unsubscribeChat();

      const qMessages = query(
        collection(db, "rooms", roomId, "messages"),
        orderBy("timestamp", "asc")
      );

      unsubscribeChat = onSnapshot(qMessages, (snapshot) => {
        chatBox.innerHTML = "";
        
        if (snapshot.empty) {
          chatBox.innerHTML = "<p style='color: var(--text-sub); text-align: center; margin-top: 20px;'>まだメッセージはありません。<br>メッセージを送って回答・コメントしましょう！</p>";
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const isMyMsg = data.senderId === senderId;
          const msgIcon = data.icon || "icon1.png";
          const senderName = data.senderName || "ゲスト";

          const rowDiv = document.createElement("div");
          rowDiv.className = `msg-row ${isMyMsg ? "my-msg" : "other-msg"}`;

          const avatarImg = document.createElement("img");
          avatarImg.className = "msg-avatar-img";
          avatarImg.src = msgIcon;

          const contentWrapper = document.createElement("div");
          contentWrapper.className = "msg-content-wrapper";

          const nameDiv = document.createElement("div");
          nameDiv.className = "msg-sender-name";
          nameDiv.innerText = senderName;

          const bubbleDiv = document.createElement("div");
          bubbleDiv.className = "msg-bubble";
          bubbleDiv.innerText = data.text;

          contentWrapper.appendChild(nameDiv);
          contentWrapper.appendChild(bubbleDiv);

          const metaDiv = document.createElement("div");
          metaDiv.className = "msg-meta";
          metaDiv.innerHTML = `<span>${formatTime(data.timestamp)}</span>`;

          rowDiv.appendChild(avatarImg);
          rowDiv.appendChild(contentWrapper);
          rowDiv.appendChild(metaDiv);
          chatBox.appendChild(rowDiv);
        });
        
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    // --- 6. メッセージ送信 ---
    async function sendMessage() {
      const text = document.getElementById("messageText").value.trim();
      if (!text || !currentRoomId) return;

      try {
        await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
          text: text,
          senderId: senderId,
          senderName: myName,
          icon: myIcon,
          timestamp: serverTimestamp()
        });
        document.getElementById("messageText").value = "";
      } catch (e) {
        alert("送信エラー: " + e.message);
      }
    }

    // イベントリスナー
    document.getElementById("btn-login-submit").addEventListener("click", saveProfileAndStart);
    document.getElementById("btn-create-request").addEventListener("click", createRequest);
    document.getElementById("btn-send").addEventListener("click", sendMessage);
    document.getElementById("btn-resolve").addEventListener("click", resolveRequest);
    
    document.getElementById("messageText").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
