<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>学習サポート掲示板</title>
  
  <!-- Google Fonts: どうぶつの森風 丸ゴシック体 (Zen Maru Gothic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f2ebd9;       /* ナチュラルベージュ背景 */
      --card-bg: #fffdf7;        /* カードアイボリー */
      --text-main: #332f2b;      /* 濃いブラウン */
      --text-sub: #7a7369;       /* アースグレー */
      --primary: #2e7d32;        /* ナチュラルグリーン */
      --success: #4caf50;        /* ライトグリーン */
      --danger: #d32f2f;         /* アースレッド */
      --border: #dcd4c3;         /* 境界線 */
      --my-msg-bg: #81c784;      /* 自分の吹き出し */
      --chat-bg: #e2d9c4;        /* トーク画面背景 */
    }

    body {
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      font-weight: 700;          /* ポップで太めな文字に設定 */
      background-color: var(--bg-color);
      color: var(--text-main);
      max-width: 768px;
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 20px;
      color: #1b5e20;
      letter-spacing: 0.05em;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(60, 50, 30, 0.06);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    /* フォーム要素 */
    input, textarea {
      font-family: inherit;
      font-weight: 700;
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
      background-color: #e8e0ce;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text-main);
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }

    button {
      font-family: inherit;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background-color: var(--primary);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active { 
      opacity: 0.8; 
      transform: scale(0.98);
    }

    /* 募集一覧アイテム */
    .request-item {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    
    .request-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .request-info { flex-grow: 1; }
    .request-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }

    .btn-chat {
      background-color: var(--success);
      width: auto;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    /* チャット画面 */
    #chat-section { display: none; }
    
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-back {
      background-color: var(--text-sub);
      width: auto;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .btn-resolve {
      background-color: var(--danger);
      width: auto;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    /* チャットモード状態バッジ */
    .mode-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    #chat-title {
      font-size: 1.15rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    /* トーク画面 */
    #chat-box {
      border: 1px solid var(--border);
      height: 440px;
      overflow-y: auto;
      padding: 16px;
      margin-bottom: 12px;
      background: var(--chat-bg);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* メッセージ行 */
    .msg-row {
      display: flex;
      width: 100%;
      align-items: flex-end;
      gap: 6px;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.my-msg {
      flex-direction: row-reverse;
    }

    .msg-row.other-msg {
      flex-direction: row;
    }

    /* フキダシ */
    .msg-bubble {
      padding: 10px 16px;
      border-radius: 18px;
      max-width: 70%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      font-weight: 500;
    }

    .my-msg .msg-bubble {
      background: var(--my-msg-bg);
      color: #113013;
      border-bottom-right-radius: 4px;
    }

    .other-msg .msg-bubble {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* 時刻表示領域 */
    .msg-meta {
      display: flex;
      flex-direction: column;
      font-size: 0.7rem;
      color: #666055;
      line-height: 1.2;
      margin-bottom: 2px;
      font-weight: 700;
    }

    .my-msg .msg-meta {
      align-items: flex-end;
    }

    .other-msg .msg-meta {
      align-items: flex-start;
    }

    /* 入力エリア */
    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input {
      margin-bottom: 0;
    }

    .input-group button {
      width: auto;
      white-space: nowrap;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <h1>学習サポート掲示板</h1>

  <!-- ==================== 1. 一覧画面 ==================== -->
  <div id="matching-section">
    <div class="card">
      <h2>教えてほしいことを投稿しよう</h2>
      <input type="text" id="reqSubject" placeholder="質問内容（例：数学のP24の問3、英語の文法）">
      <button id="btn-create-request">投稿して質問する</button>
    </div>

    <div class="card">
      <h2>現在サポート待ちの質問</h2>
      <div id="request-list">読み込み中...</div>
    </div>
  </div>


  <!-- ==================== 2. チャットモード画面 ==================== -->
  <div id="chat-section">
    <div class="chat-header">
      <button id="btn-back-to-list" class="btn-back">← 一覧に戻る</button>
      <button id="btn-resolve" class="btn-resolve">解決済みにする</button>
    </div>

    <div class="card">
      <div style="text-align: center;">
        <span class="mode-badge">🟢 チャットモード（リアルタイム対話中）</span>
        <h2 id="chat-title">質問</h2>
      </div>

      <div id="chat-box"></div>
      
      <div class="input-group">
        <input type="text" id="messageText" placeholder="メッセージを入力...">
        <button id="btn-send">送信</button>
      </div>
    </div>
  </div>


  <!-- Firebase (v10) SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAkGHvYqrhlu3bF_P6LIXk0YjmSAfyFj08",
      authDomain: "study-matching-test.firebaseapp.com",
      projectId: "study-matching-test",
      storageBucket: "study-matching-test.firebasestorage.app",
      messagingSenderId: "720859286999",
      appId: "1:720859286999:web:9f61a8a71989db79d94f92",
      measurementId: "G-62FYMVGYFY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let senderId = localStorage.getItem("senderId");
    if (!senderId) {
      senderId = "user_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("senderId", senderId);
    }

    let currentRoomId = null;
    let currentDocId = null;
    let unsubscribeChat = null;

    // --- 1. 質問投稿 ---
    async function createRequest() {
      const subject = document.getElementById("reqSubject").value.trim();
      if (!subject) {
        alert("質問内容を入力してください。");
        return;
      }

      const roomId = "room_" + Date.now();

      try {
        await addDoc(collection(db, "requests"), {
          subject: subject,
          roomId: roomId,
          createdAt: serverTimestamp()
        });
        document.getElementById("reqSubject").value = "";
        openChat(roomId, subject, null);
      } catch (e) {
        alert("エラーが発生しました: " + e.message);
      }
    }

    // --- 2. 一覧表示 ---
    const qRequests = query(collection(db, "requests"), orderBy("createdAt", "desc"));
    onSnapshot(qRequests, (snapshot) => {
      const listDiv = document.getElementById("request-list");
      listDiv.innerHTML = "";

      if (snapshot.empty) {
        listDiv.innerHTML = "<p style='color: var(--text-sub); text-align: center; margin: 20px 0;'>現在、質問はありません。</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const docId = docSnap.id;

        const item = document.createElement("div");
        item.className = "request-item";
        item.innerHTML = `
          <div class="request-info">
            <div class="request-title">${data.subject}</div>
          </div>
          <button class="btn-chat" onclick="openChat('${data.roomId}', '${data.subject}', '${docId}')">教える / トークを開く</button>
        `;
        listDiv.appendChild(item);
      });
    });

    // --- 3. チャットモード開く ---
    window.openChat = function(roomId, subject, docId) {
      currentRoomId = roomId;
      currentDocId = docId;

      document.getElementById("matching-section").style.display = "none";
      document.getElementById("chat-section").style.display = "block";
      document.getElementById("chat-title").innerText = `「${subject}」`;

      joinChatRoom(roomId);
    };

    document.getElementById("btn-back-to-list").addEventListener("click", () => {
      if (unsubscribeChat) unsubscribeChat();
      document.getElementById("chat-section").style.display = "none";
      document.getElementById("matching-section").style.display = "block";
    });

    // --- 4. 解決済み ---
    async function resolveRequest() {
      if (!currentDocId) {
        alert("一覧に戻ります。");
        document.getElementById("btn-back-to-list").click();
        return;
      }

      const confirmResolve = confirm("この質問を「解決済み」にしますか？\n※一覧から削除されます");
      if (!confirmResolve) return;

      try {
        await deleteDoc(doc(db, "requests", currentDocId));
        alert("解決済みにしました！");
        document.getElementById("btn-back-to-list").click();
      } catch (e) {
        alert("エラーが発生しました: " + e.message);
      }
    }

    // 時刻フォーマット関数 (HH:MM)
    function formatTime(timestamp) {
      if (!timestamp) return "";
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    // --- 5. リアルタイム・チャット受信（送信時間のみ表示） ---
    function joinChatRoom(roomId) {
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = "<p style='color: var(--text-sub); text-align: center;'>チャットに接続中...</p>";

      if (unsubscribeChat) unsubscribeChat();

      const qMessages = query(
        collection(db, "rooms", roomId, "messages"),
        orderBy("timestamp", "asc")
      );

      unsubscribeChat = onSnapshot(qMessages, (snapshot) => {
        chatBox.innerHTML = "";
        
        if (snapshot.empty) {
          chatBox.innerHTML = "<p style='color: var(--text-sub); text-align: center; margin-top: 20px;'>まだメッセージはありません。<br>メッセージを送って会話を始めましょう！</p>";
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const isMyMsg = data.senderId === senderId;

          const rowDiv = document.createElement("div");
          rowDiv.className = `msg-row ${isMyMsg ? "my-msg" : "other-msg"}`;

          // メッセージ吹き出し
          const bubbleDiv = document.createElement("div");
          bubbleDiv.className = "msg-bubble";
          bubbleDiv.innerText = data.text;

          // 時間表示領域
          const metaDiv = document.createElement("div");
          metaDiv.className = "msg-meta";

          const timeStr = formatTime(data.timestamp);
          metaDiv.innerHTML = `<span>${timeStr}</span>`;

          rowDiv.appendChild(bubbleDiv);
          rowDiv.appendChild(metaDiv);
          chatBox.appendChild(rowDiv);
        });
        
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    // --- 6. 送信 ---
    async function sendMessage() {
      const text = document.getElementById("messageText").value.trim();
      if (!text || !currentRoomId) return;

      try {
        await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
          text: text,
          senderId: senderId,
          timestamp: serverTimestamp()
        });
        document.getElementById("messageText").value = "";
      } catch (e) {
        alert("送信エラー: " + e.message);
      }
    }

    document.getElementById("btn-create-request").addEventListener("click", createRequest);
    document.getElementById("btn-send").addEventListener("click", sendMessage);
    document.getElementById("btn-resolve").addEventListener("click", resolveRequest);
    
    document.getElementById("messageText").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
