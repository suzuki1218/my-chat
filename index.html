<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掲示板</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    .box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, textarea, button { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; border-radius: 4px; margin-top: 15px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .post { background-color: #f9f9f9; border-left: 4px solid #007bff; padding: 10px; margin-bottom: 10px; }
    .urgent { border-left-color: #dc3545; background-color: #fff5f5; }
    .badge { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; }
    .urgent-badge { background: #dc3545; color: white; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>掲示板</h1>

  <!-- 1. ユーザー設定パネル（クラス選択） -->
  <div id="user-section" class="box">
    <h2>プロフィール設定</h2>
    <label for="userName">名前</label>
    <input type="text" id="userName" placeholder="山田 太郎">

    <label for="classSelect">所属クラス</label>
    <select id="classSelect">
      <option value="">選択してください</option>
      <option value="105">1年5組 (105)</option> <!-- -->
      <option value="106">1年6組 (106)</option> <!-- -->
      <option value="107">1年7組 (107)</option> <!--[cite: 1] -->
      <option value="108">1年8組 (108)</option> <!--[cite: 1] -->
      <option value="109">1年9組 (109)</option> <!--[cite: 1] -->
      <option value="110">1年10組 (110)</option> <!--[cite: 1] -->
      <option value="310">3年10組 (310)</option> <!--[cite: 1] -->
      <option value="311">3年11組 (311)</option> <!--[cite: 1] -->
    </select>

    <button id="saveUserBtn">設定を保存して掲示板に入る</button>
  </div>

  <!-- 2. 掲示板メイン画面 -->
  <div id="board-section" class="box hidden">
    <h2>掲示板 (<span id="displayClassName"></span>)</h2>
    <p>ログイン中: <strong id="displayName"></strong>さん</p>
    <button id="changeClassBtn" style="background-color: #6c757d; width: auto; padding: 4px 8px;">クラス変更</button>

    <hr style="margin: 20px 0;">

    <!-- 投稿フォーム -->
    <h3>質問・トピックを投稿する</h3>
    <textarea id="postContent" rows="3" placeholder="質問を入力してください"></textarea>
    
    <div style="margin-top: 10px;">
      <label style="display: inline; font-weight: normal;">
        <input type="checkbox" id="isUrgent" style="width: auto;"> 🚨 【緊急】（解決者に3pt付与）
      </label>
    </div>

    <button id="submitPostBtn">投稿する</button>

    <hr style="margin: 20px 0;">

    <!-- 投稿一覧表示エリア -->
    <h3>みんなの質問一覧</h3>
    <div id="postsContainer">読み込み中...</div>
  </div>

  <!-- Firebase SDK (v10) の読み込み -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // 🔑 Firebaseの接続設定（ご自身のプロジェクト設定に置き換えてください）
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ローカルストレージを使って簡易的にユーザー情報を保持
    let currentUser = JSON.parse(localStorage.getItem("board_user")) || null;
    let unsubscribePosts = null; // リアルタイム監視の解除用

    // 要素の取得
    const userSection = document.getElementById("user-section");
    const boardSection = document.getElementById("board-section");
    const classSelect = document.getElementById("classSelect");
    const userNameInput = document.getElementById("userName");
    const saveUserBtn = document.getElementById("saveUserBtn");
    const changeClassBtn = document.getElementById("changeClassBtn");
    const displayName = document.getElementById("displayName");
    const displayClassName = document.getElementById("displayClassName");
    const submitPostBtn = document.getElementById("submitPostBtn");
    const postContent = document.getElementById("postContent");
    const isUrgent = document.getElementById("isUrgent");
    const postsContainer = document.getElementById("postsContainer");

    // クラスID (例: 105) から表示名 (1年5組) を作成する関数[cite: 1]
    function formatClassName(classId) {
      const grade = Math.floor(classId / 100); //[cite: 1]
      const classNum = classId % 100;          //[cite: 1]
      return `${grade}年${classNum}組 (${classId})`; //[cite: 1]
    }

    // 画面の初期状態チェック
    function initApp() {
      if (currentUser && currentUser.class_id) {
        userSection.classList.add("hidden");
        boardSection.classList.remove("hidden");
        displayName.textContent = currentUser.name;
        displayClassName.textContent = formatClassName(currentUser.class_id);
        loadClassPosts(currentUser.class_id);
      } else {
        userSection.classList.remove("hidden");
        boardSection.classList.add("hidden");
      }
    }

    // ユーザー情報の保存（クラス設定）
    saveUserBtn.addEventListener("click", () => {
      const name = userNameInput.value.trim();
      const classId = parseInt(classSelect.value, 10); // 数値型(105, 110, 310等)に変換[cite: 1]

      if (!name || isNaN(classId)) {
        alert("名前とクラスを選択してください。");
        return;
      }

      currentUser = { name: name, class_id: classId };
      localStorage.setItem("board_user", JSON.stringify(currentUser));
      initApp();
    });

    // クラス変更ボタン
    changeClassBtn.addEventListener("click", () => {
      if (unsubscribePosts) unsubscribePosts(); // 監視解除
      localStorage.removeItem("board_user");
      currentUser = null;
      initApp();
    });

    // 投稿処理
    submitPostBtn.addEventListener("click", async () => {
      const text = postContent.value.trim();
      const urgent = isUrgent.checked;

      if (!text) {
        alert("投稿内容を入力してください。");
        return;
      }

      try {
        await addDoc(collection(db, "posts"), {
          content: text,
          authorName: currentUser.name,
          class_id: currentUser.class_id, // 自分のクラスID (例: 105) を埋め込み[cite: 1]
          isUrgent: urgent,
          rewardPoints: urgent ? 3 : 1,    // 緊急なら3pt、通常なら1pt
          createdAt: serverTimestamp()
        });

        postContent.value = "";
        isUrgent.checked = false;
      } catch (e) {
        console.error("投稿エラー:", e);
        alert("投稿に失敗しました。");
      }
    });

    // 自分のクラスの投稿をリアルタイムで取得する関数[cite: 1]
    function loadClassPosts(studentClassId) {
      // 既存の監視があれば解除
      if (unsubscribePosts) unsubscribePosts();

      // 自分と同じ class_id の投稿のみ取得[cite: 1]
      const q = query(
        collection(db, "posts"),
        where("class_id", "==", Number(studentClassId)), // 数値型でフィルタリング[cite: 1]
        orderBy("createdAt", "desc")
      );

      unsubscribePosts = onSnapshot(q, (snapshot) => {
        postsContainer.innerHTML = "";

        if (snapshot.empty) {
          postsContainer.innerHTML = "<p>まだこのクラスの投稿はありません。</p>";
          return;
        }

        snapshot.forEach((doc) => {
          const data = doc.data();
          const postEl = document.createElement("div");
          postEl.className = `post ${data.isUrgent ? 'urgent' : ''}`;

          postEl.innerHTML = `
            <div>
              <strong>${data.authorName}</strong>
              ${data.isUrgent ? '<span class="badge urgent-badge">🚨 緊急 (+3pt)</span>' : '<span class="badge">通常</span>'}
            </div>
            <p style="margin: 8px 0;">${data.content}</p>
          `;
          postsContainer.appendChild(postEl);
        });
      }, (error) => {
        console.error("データ取得エラー:", error);
        postsContainer.innerHTML = "<p>投稿の読み込みに失敗しました。</p>";
      });
    }

    // 起動時実行
    initApp();
  </script>
</body>
</html>
