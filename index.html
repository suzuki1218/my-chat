<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>質問掲示板</title>
  <style>
    /* 元のベースコードのCSSをそのまま維持 */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1, h2 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
    canvas {
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: crosshair;
      touch-action: none;
      width: 100%;
      height: 200px;
      display: block;
    }
    .clear-btn {
      background-color: #dc3545;
      margin-top: 5px;
      padding: 5px;
      font-size: 12px;
    }
    .clear-btn:hover {
      background-color: #c82333;
    }
    .request-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .request-item:last-child {
      border-bottom: none;
    }
    .emergency {
      background-color: #ffe6e6;
      border-left: 5px solid #dc3545;
      padding: 10px;
      border-radius: 4px;
    }
    .class-status-bar {
      background: #e9ecef;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>質問掲示板</h1>

  <!-- クラスコード入力エリア -->
  <div class="class-status-bar">
    <div class="form-group" style="margin-bottom: 5px;">
      <label for="roomCodeInput">クラスコードを入力</label>
      <div style="display: flex; gap: 5px;">
        <input type="text" id="roomCodeInput" placeholder="例: 0105" maxlength="10">
        <button id="setRoomBtn" style="width: 100px; padding: 8px;">決定</button>
      </div>
      <p id="currentRoomText" style="margin: 5px 0 0 0; font-size: 14px; color: #555;"></p>
    </div>
  </div>

  <!-- 元の投稿フォーム -->
  <div class="form-group">
    <label for="nameInput">お名前</label>
    <input type="text" id="nameInput" placeholder="名前を入力">
  </div>

  <div class="form-group">
    <label for="textInput">質問内容</label>
    <textarea id="textInput" rows="4" placeholder="質問を入力"></textarea>
  </div>

  <div class="form-group">
    <label>手書きCanvas</label>
    <canvas id="drawCanvas"></canvas>
    <button type="button" id="clearCanvasBtn" class="clear-btn">手書きをクリア</button>
  </div>

  <div class="form-group">
    <label>
      <input type="checkbox" id="emergencyCheck"> 緊急質問
    </label>
  </div>

  <button id="sendBtn">送信</button>

  <h2>質問一覧</h2>
  <div id="requestList">
    <p>クラスコードを入力すると質問が表示されます。</p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    query, 
    where, 
    orderBy, 
    onSnapshot, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // ★ご自身のFirebase設定情報
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentRoomCode = localStorage.getItem('user_room_code') || '';
  let unsubscribe = null;

  const roomCodeInput = document.getElementById('roomCodeInput');
  const setRoomBtn = document.getElementById('setRoomBtn');
  const currentRoomText = document.getElementById('currentRoomText');
  const requestList = document.getElementById('requestList');

  // 初期ロード処理
  if (currentRoomCode) {
    roomCodeInput.value = currentRoomCode;
    updateRoomDisplay();
    setupSnapshotListener();
  }

  // 「決定」ボタンでクラスコードを設定
  setRoomBtn.addEventListener('click', () => {
    const code = roomCodeInput.value.trim();
    if (!code) {
      alert("クラスコードを入力してください。");
      return;
    }
    currentRoomCode = code;
    localStorage.setItem('user_room_code', currentRoomCode);
    updateRoomDisplay();
    setupSnapshotListener();
  });

  function updateRoomDisplay() {
    currentRoomText.textContent = `現在のクラスコード: ${currentRoomCode}`;
  }

  // --- 手書きCanvas機能（元のまま） ---
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function initCanvas() {
    canvas.width = canvas.parentElement.clientWidth - 2;
    canvas.height = 200;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';
  }
  window.addEventListener('resize', initCanvas);
  initCanvas();

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDraw(e) {
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDraw() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
  canvas.addEventListener('touchend', stopDraw);

  document.getElementById('clearCanvasBtn').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  function isCanvasBlank() {
    const blank = document.createElement('canvas');
    blank.width = canvas.width;
    blank.height = canvas.height;
    return canvas.toDataURL() === blank.toDataURL();
  }

  // --- Firestore リアルタイム取得 (クラス絞り込み) ---
  function setupSnapshotListener() {
    if (unsubscribe) unsubscribe();

    if (!currentRoomCode) {
      requestList.innerHTML = '<p>クラスコードを入力すると質問が表示されます。</p>';
      return;
    }

    const q = query(
      collection(db, "requests"),
      where("roomCode", "==", currentRoomCode),
      orderBy("createdAt", "desc")
    );

    unsubscribe = onSnapshot(q, (snapshot) => {
      requestList.innerHTML = '';

      if (snapshot.empty) {
        requestList.innerHTML = '<p>質問はありません。</p>';
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        const div = document.createElement('div');
        div.className = `request-item ${data.isEmergency ? 'emergency' : ''}`;

        let imgHtml = data.imageData ? `<br><img src="${data.imageData}" style="max-width:100%; border:1px solid #ccc; margin-top:5px;">` : '';

        div.innerHTML = `
          <strong>${escapeHtml(data.name)}</strong> 
          ${data.isEmergency ? '<span style="color:red; font-weight:bold;">[緊急]</span>' : ''}<br>
          ${escapeHtml(data.text)}
          ${imgHtml}
        `;
        requestList.appendChild(div);
      });
    });
  }

  // --- 送信処理 ---
  document.getElementById('sendBtn').addEventListener('click', async () => {
    if (!currentRoomCode) {
      alert("クラスコードを入力・決定してください！");
      return;
    }

    const nameInput = document.getElementById('nameInput');
    const textInput = document.getElementById('textInput');
    const emergencyCheck = document.getElementById('emergencyCheck');

    const name = nameInput.value.trim() || '匿名';
    const text = textInput.value.trim();
    const hasCanvas = !isCanvasBlank();

    if (!text && !hasCanvas) {
      alert("質問内容または手書き入力をしてください。");
      return;
    }

    try {
      await addDoc(collection(db, "requests"), {
        roomCode: currentRoomCode,
        name: name,
        text: text,
        imageData: hasCanvas ? canvas.toDataURL() : null,
        isEmergency: emergencyCheck.checked,
        createdAt: serverTimestamp()
      });

      textInput.value = '';
      emergencyCheck.checked = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      alert("送信しました！");

    } catch (e) {
      console.error("Error: ", e);
      alert("送信に失敗しました。");
    }
  });

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
  }
</script>

</body>
</html>
