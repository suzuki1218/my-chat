<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラス別サポート掲示板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f2f7eb;
      --main-green: #58b05c;
      --accent-yellow: #f8e16c;
      --card-bg: #fffdf7;
      --board-border: #e2d2ac;
      --text-color: #534537;
      --urgent-red: #ff7675;
      --disabled-gray: #a0a0a0;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 650px;
      margin: 20px auto;
      padding: 0 15px;
    }

    h1 {
      text-align: center;
      color: var(--main-green);
      font-weight: 800;
      text-shadow: 2px 2px 0px #fff;
      font-size: 1.8rem;
    }

    .box {
      background-color: var(--card-bg);
      border: 4px solid var(--board-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 6px 0px var(--board-border);
    }

    /* 先生用コントロールパネル */
    .teacher-box {
      background-color: #fff9e6;
      border: 4px solid var(--accent-yellow);
      border-radius: 20px;
      padding: 15px 20px;
      margin-bottom: 20px;
    }

    h2, h3 { color: var(--main-green); font-weight: 700; margin-top: 0; }

    label { display: block; margin-top: 12px; font-weight: 700; }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 3px solid var(--board-border);
      border-radius: 12px;
      background-color: #fff;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 1rem;
      color: var(--text-color);
      box-sizing: border-box;
      outline: none;
    }

    button {
      background-color: var(--main-green);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 800;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 0px #3d8841;
      width: 100%;
      margin-top: 15px;
      transition: all 0.1s ease;
    }

    button:active {
      box-shadow: 0 0px 0px #3d8841;
      transform: translateY(4px);
    }

    button:disabled {
      background-color: var(--disabled-gray) !important;
      box-shadow: 0 4px 0px #707070 !important;
      cursor: not-allowed;
    }

    .btn-sub {
      background-color: #a0a0a0;
      box-shadow: 0 4px 0px #707070;
      width: auto;
      padding: 6px 15px;
      font-size: 0.85rem;
    }

    /* 先生用スイッチボタン */
    .btn-toggle-on {
      background-color: #ff7675;
      box-shadow: 0 4px 0px #d63031;
    }
    .btn-toggle-off {
      background-color: var(--main-green);
      box-shadow: 0 4px 0px #3d8841;
    }

    /* ロック中のオーバーレイ表示 */
    .status-banner {
      background-color: #ffeaa7;
      color: #d63031;
      padding: 10px;
      border-radius: 12px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 15px;
    }

    .post {
      background-color: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .urgent { border-color: var(--urgent-red); background-color: #fff5f5; }

    .badge {
      display: inline-block;
      background-color: var(--accent-yellow);
      color: var(--text-color);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .urgent-badge { background-color: var(--urgent-red); color: white; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>🍃 クラスサポート掲示板 🍃</h1>

  <!-- 1. 先生用コントロールパネル（パスワード保護簡易付き） -->
  <div class="teacher-box">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-weight: 800;">⚙️ 先生用設定</span>
      <button id="toggleTeacherModeBtn" class="btn-sub" style="margin:0;">先生モード表示</button>
    </div>

    <div id="teacherControls" class="hidden" style="margin-top: 15px;">
      <p style="margin: 0 0 10px 0; font-size: 0.9rem;">現在の状態: <strong id="currentStatusText">読み込み中...</strong></p>
      <button id="toggleBoardBtn" class="btn-toggle-on">掲示板の受付を停止する</button>
    </div>
  </div>

  <!-- 2. ユーザー設定パネル -->
  <div id="user-section" class="box">
    <h2>プロフィールを教えてね</h2>
    <label for="userName">おなまえ</label>
    <input type="text" id="userName" placeholder="なまえを入力">

    <label for="classSelect">クラス</label>
    <select id="classSelect">
      <option value="">えらんでね</option>
      <option value="105">1年5组 (105)</option> <!--[cite: 1] -->
      <option value="106">1年6組 (106)</option> <!--[cite: 1] -->
      <option value="107">1年7組 (107)</option> <!--[cite: 1] -->
      <option value="108">1年8組 (108)</option> <!--[cite: 1] -->
      <option value="109">1年9組 (109)</option> <!--[cite: 1] -->
      <option value="110">1年10組 (110)</option> <!--[cite: 1] -->
      <option value="310">3年10組 (310)</option> <!--[cite: 1] -->
      <option value="311">3年11組 (311)</option> <!--[cite: 1] -->
    </select>

    <button id="saveUserBtn">けいじばんに入る！</button>
  </div>

  <!-- 3. 掲示板メイン画面 -->
  <div id="board-section" class="box hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h2><span id="displayClassName"></span> の掲示板</h2>
      <button id="changeClassBtn" class="btn-sub">クラスへんこう</button>
    </div>
    <p style="margin-top:0;">こんにちは、<strong id="displayName"></strong> さん！</p>

    <!-- 利用停止中の注意メッセージ -->
    <div id="statusBanner" class="statusBanner hidden">
      🔒 ただいま掲示板は【利用停止中】です。授業中・放課後まで待ってね！
    </div>

    <hr style="border: none; border-top: 2px dashed var(--board-border); margin: 20px 0;">

    <!-- 投稿フォーム -->
    <h3>質問やメッセージを書く</h3>
    <textarea id="postContent" rows="3" placeholder="ここにメッセージをかいてね"></textarea>
    
    <div style="margin-top: 10px;">
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: normal;">
        <input type="checkbox" id="isUrgent" style="width: 20px; height: 20px;"> 🚨 【きんきゅう】たすけて！(解決したら3pt)
      </label>
    </div>

    <button id="submitPostBtn">とうこうする！</button>

    <hr style="border: none; border-top: 2px dashed var(--board-border); margin: 20px 0;">

    <h3>みんなのメッセージ</h3>
    <div id="postsContainer">読み込み中...</div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, doc, setDoc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = JSON.parse(localStorage.getItem("board_user")) || null;
    let unsubscribePosts = null;
    let isBoardOpen = true; // 掲示板が開いているかのステータス

    const userSection = document.getElementById("user-section");
    const boardSection = document.getElementById("board-section");
    const classSelect = document.getElementById("classSelect");
    const userNameInput = document.getElementById("userName");
    const saveUserBtn = document.getElementById("saveUserBtn");
    const changeClassBtn = document.getElementById("changeClassBtn");
    const displayName = document.getElementById("displayName");
    const displayClassName = document.getElementById("displayClassName");
    const submitPostBtn = document.getElementById("submitPostBtn");
    const postContent = document.getElementById("postContent");
    const isUrgent = document.getElementById("isUrgent");
    const postsContainer = document.getElementById("postsContainer");
    
    // 先生用エレメント
    const toggleTeacherModeBtn = document.getElementById("toggleTeacherModeBtn");
    const teacherControls = document.getElementById("teacherControls");
    const currentStatusText = document.getElementById("currentStatusText");
    const toggleBoardBtn = document.getElementById("toggleBoardBtn");
    const statusBanner = document.getElementById("statusBanner");

    function formatClassName(classId) {
      const grade = Math.floor(classId / 100); //[cite: 1]
      const classNum = classId % 100;          //[cite: 1]
      return `${grade}年${classNum}组`;
    }

    // 🌐 1. 掲示板のON/OFF状態をリアルタイム監視
    function listenBoardStatus() {
      const statusRef = doc(db, "settings", "boardStatus");
      onSnapshot(statusRef, (docSnap) => {
        if (docSnap.exists()) {
          isBoardOpen = docSnap.data().isOpen;
        } else {
          isBoardOpen = true; // デフォルトはON
        }
        updateUIByStatus();
      });
    }

    // 状態に合わせて画面のボタン無効化・警告表示を切り替える
    function updateUIByStatus() {
      if (isBoardOpen) {
        currentStatusText.textContent = "🟢 受付中（利用可能）";
        toggleBoardBtn.textContent = "掲示板の受付を停止する";
        toggleBoardBtn.className = "btn-toggle-on";
        
        statusBanner.classList.add("hidden");
        submitPostBtn.disabled = false;
        postContent.disabled = false;
        isUrgent.disabled = false;
      } else {
        currentStatusText.textContent = "🔴 停止中（利用不可）";
        toggleBoardBtn.textContent = "掲示板の受付を開始する";
        toggleBoardBtn.className = "btn-toggle-off";

        statusBanner.classList.remove("hidden");
        submitPostBtn.disabled = true;
        postContent.disabled = true;
        isUrgent.disabled = true;
      }
    }

    // 🔑 先生モードパネルの表示切り替え（暗証番号: 1234 例）
    toggleTeacherModeBtn.addEventListener("click", () => {
      if (teacherControls.classList.contains("hidden")) {
        const pass = prompt("先生用パスワードを入力してください（初期設定: 1234）");
        if (pass === "1234") {
          teacherControls.classList.remove("hidden");
          toggleTeacherModeBtn.textContent = "先生モードを閉じる";
        } else if (pass !== null) {
          alert("パスワードが違います");
        }
      } else {
        teacherControls.classList.add("hidden");
        toggleTeacherModeBtn.textContent = "先生モード表示";
      }
    });

    // 🔄 先生がスイッチを押した時の処理
    toggleBoardBtn.addEventListener("click", async () => {
      const statusRef = doc(db, "settings", "boardStatus");
      try {
        await setDoc(statusRef, { isOpen: !isBoardOpen });
      } catch (e) {
        console.error("ステータス変更エラー:", e);
        alert("設定の変更に失敗しました。");
      }
    });

    function initApp() {
      if (currentUser && currentUser.class_id) {
        userSection.classList.add("hidden");
        boardSection.classList.remove("hidden");
        displayName.textContent = currentUser.name;
        displayClassName.textContent = formatClassName(currentUser.class_id);
        loadClassPosts(currentUser.class_id);
      } else {
        userSection.classList.remove("hidden");
        boardSection.classList.add("hidden");
      }
    }

    saveUserBtn.addEventListener("click", () => {
      const name = userNameInput.value.trim();
      const classId = parseInt(classSelect.value, 10); //[cite: 1]

      if (!name || isNaN(classId)) {
        alert("おなまえとクラスをえらんでね！");
        return;
      }

      currentUser = { name: name, class_id: classId };
      localStorage.setItem("board_user", JSON.stringify(currentUser));
      initApp();
    });

    changeClassBtn.addEventListener("click", () => {
      if (unsubscribePosts) unsubscribePosts();
      localStorage.removeItem("board_user");
      currentUser = null;
      initApp();
    });

    // 投稿処理（利用停止中は押せない＆裏でもガード）
    submitPostBtn.addEventListener("click", async () => {
      if (!isBoardOpen) {
        alert("ただいま掲示板は利用停止中です。");
        return;
      }

      const text = postContent.value.trim();
      const urgent = isUrgent.checked;

      if (!text) {
        alert("メッセージを入力してね！");
        return;
      }

      try {
        await addDoc(collection(db, "posts"), {
          content: text,
          authorName: currentUser.name,
          class_id: currentUser.class_id, //[cite: 1]
          isUrgent: urgent,
          rewardPoints: urgent ? 3 : 1,
          createdAt: serverTimestamp()
        });

        postContent.value = "";
        isUrgent.checked = false;
      } catch (e) {
        console.error("投稿エラー:", e);
        alert("とうこうに失敗しちゃいました。");
      }
    });

    function loadClassPosts(studentClassId) {
      if (unsubscribePosts) unsubscribePosts();

      const q = query(
        collection(db, "posts"),
        where("class_id", "==", Number(studentClassId)), //[cite: 1]
        orderBy("createdAt", "desc")
      );

      unsubscribePosts = onSnapshot(q, (snapshot) => {
        postsContainer.innerHTML = "";

        if (snapshot.empty) {
          postsContainer.innerHTML = "<p style='text-align:center;'>まだ投稿がないみたい🍃</p>";
          return;
        }

        snapshot.forEach((doc) => {
          const data = doc.data();
          const postEl = document.createElement("div");
          postEl.className = `post ${data.isUrgent ? 'urgent' : ''}`;

          postEl.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong>👤 ${data.authorName}</strong>
              ${data.isUrgent ? '<span class="badge urgent-badge">🚨 きんきゅう (+3pt)</span>' : '<span class="badge">つうじょう</span>'}
            </div>
            <p style="margin: 10px 0 0 0; line-height: 1.5;">${data.content}</p>
          `;
          postsContainer.appendChild(postEl);
        });
      }, (error) => {
        console.error("データ取得エラー:", error);
        postsContainer.innerHTML = "<p>データの読み込みに失敗しました。</p>";
      });
    }

    // 起動時処理
    listenBoardStatus();
    initApp();
  </script>
</body>
</html>
